<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Review</title>
    <meta name="author" content="Vitor Soares Fernandes">
    <meta name="description"
        content="Week 05 activity: Product Review Form, applying good form design principles, meeting specific field requirements, and including a submission confirmation with a counter.">
    <link rel="stylesheet" href="styles/form.css">
    <link rel="stylesheet" href="styles/form-large.css">
    <script src="scripts/form.js" defer></script>
</head>

<body>
    <header>
        <h1>Product Review</h1>
    </header>

    <main>
        <form method="get" action="review.html">
            <p>Fields marked with * are required.</p>

            <label for="product-name">Product Name *</label>
            <select id="product-name" name="product" required>
                <option value="" disabled selected>Select a Product ...</option>
            </select>

            <fieldset>
                <legend>Overall Rating *</legend>

                <div class="rating">
                    <div>
                        <label for="rating-1">
                            <span aria-hidden="true">☆</span>
                            <span class="sr-only">1 star</span>
                        </label>
                        <input type="radio" id="rating-1" name="rating" value="1" required>
                    </div>

                    <div>
                        <label for="rating-2">
                            <span aria-hidden="true">☆☆</span>
                            <span class="sr-only">2 stars</span>
                        </label>
                        <input type="radio" id="rating-2" name="rating" value="2" required>
                    </div>

                    <div>
                        <label for="rating-3">
                            <span aria-hidden="true">☆☆☆</span>
                            <span class="sr-only">3 stars</span>
                        </label>
                        <input type="radio" id="rating-3" name="rating" value="3" required>
                    </div>

                    <div>
                        <label for="rating-4">
                            <span aria-hidden="true">☆☆☆☆</span>
                            <span class="sr-only">4 stars</span>
                        </label>
                        <input type="radio" id="rating-4" name="rating" value="4" required>
                    </div>

                    <div>
                        <label for="rating-5">
                            <span aria-hidden="true">☆☆☆☆☆</span>
                            <span class="sr-only">5 stars</span>
                        </label>
                        <input type="radio" id="rating-5" name="rating" value="5" required>
                    </div>
                </div>
            </fieldset>

            <label for="installation-date">Date of Installation *</label>
            <input type="date" id="installation-date" name="installationDate" required>

            <fieldset>
                <legend>Useful Features</legend>
                <p>Which features did you find useful in the product?</p>
                <p><em>Check all that apply.</em></p>

                <div class="features">
                    <div>
                        <input type="checkbox" id="durability" name="features" value="durability">
                        <label for="durability">Durability</label>
                    </div>

                    <div>
                        <input type="checkbox" id="ease-of-use" name="features" value="ease-of-use">
                        <label for="ease-of-use">Ease of Use</label>
                    </div>

                    <div>
                        <input type="checkbox" id="performance" name="features" value="performance">
                        <label for="performance">Performance</label>
                    </div>

                    <div>
                        <input type="checkbox" id="design" name="features" value="design">
                        <label for="design">Design</label>
                    </div>
                </div>
            </fieldset>

            <label for="written-review">
                Written Review <span class="optional">(Optional)</span>
            </label>
            <textarea id="written-review" name="review" rows="5"></textarea>

            <label for="user-name">
                Your Name <span class="optional">(Optional)</span>
            </label>
            <input type="text" id="user-name" name="userName" autocomplete="name">

            <input type="submit" value="Post Review">
        </form>
    </main>

    <footer>
        <p>&copy;<span id="currentyear"></span> ⚔️ Vitor Soares Fernandes ⚔️ Brazil</p>
        <p id="lastModified"></p>
    </footer>
</body>

</html>
